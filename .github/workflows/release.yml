name: release

# Releases are cut by release-please:
#   1. Every push to main opens or updates a "chore(main): release X.Y.Z" PR
#      that bumps the version and CHANGELOG.md from the Conventional Commit
#      titles merged since the last release (see pr-title.yml).
#   2. Merging that PR tags vX.Y.Z and publishes the GitHub Release; the build
#      job below then attaches the artifacts to it.
# A PR that edits this file runs the build job as a dry run: the artifacts are
# kept on the workflow run and nothing is published.
on:
  push:
    branches: [main]
  pull_request:
    paths: [.github/workflows/release.yml]

permissions: {}

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A PR opened with the default GITHUB_TOKEN does not trigger CI, so on a
      # main that requires status checks the release PR could never merge.
      # Setting the RELEASE_APP_CLIENT_ID variable and RELEASE_APP_PRIVATE_KEY
      # secret makes release-please act as that GitHub App instead.
      - uses: actions/create-github-app-token@v3
        id: app
        if: vars.RELEASE_APP_CLIENT_ID != ''
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app.outputs.token || github.token }}

  build:
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'pull_request') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - run: npm ci
      - run: npm run build

      # The tarball installs with `npm install -g <release asset URL>`;
      # publishing to the npm registry is a separate, later step.
      - name: pack
        run: |
          mkdir -p out
          npm pack --pack-destination out/
          cd out && sha256sum -- *.tgz > SHA256SUMS && cat SHA256SUMS

      - name: attach to release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" out/*.tgz out/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"

      - name: keep dry-run artifacts
        if: env.TAG == ''
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            out/*.tgz
            out/SHA256SUMS
          retention-days: 3
